<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards Deck - Demo</title>
  <link rel="stylesheet" href="/styles/cards.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a5276 0%, #2e86c1 100%);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: white;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #f39c12;
      color: white;
      transition: all 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    button:hover {
      background: #e67e22;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .section {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
    }
    
    .section h2 {
      margin-top: 0;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      padding-bottom: 10px;
    }
    
    #full-deck-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 20px;
    }
    
    #hand-container {
      min-height: 180px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      position: relative;
    }
    
    .info {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    
    .stat-card {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #f39c12;
    }
    
    .stat-label {
      font-size: 0.9em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🃏 Playing Cards Deck Demo</h1>
    
    <div class="controls">
      <button onclick="demo.createAndRenderDeck()">Create New Deck</button>
      <button onclick="demo.shuffleDeck()">Shuffle Deck</button>
      <button onclick="demo.dealHand()">Deal Hand (5 cards)</button>
      <button onclick="demo.resetDeck()">Reset Deck</button>
      <button onclick="demo.toggleView()">Toggle View</button>
    </div>
    
    <div class="section">
      <h2>Full Deck View</h2>
      <div id="full-deck-container"></div>
    </div>
    
    <div class="section">
      <h2>Your Hand</h2>
      <div id="hand-container"></div>
    </div>
    
    <div class="info">
      <h3>Deck Information</h3>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="total-cards">52</div>
          <div class="stat-label">Total Cards</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="cards-in-deck">52</div>
          <div class="stat-label">Cards in Deck</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="cards-in-hand">0</div>
          <div class="stat-label">Cards in Hand</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="deck-style">classic</div>
          <div class="stat-label">Deck Style</div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/public/demo.js"></script>
</body>
</html>
